[options]
; ==============================================================================
; Alomar Odoo Community Configuration File
; ==============================================================================

; --- Addons Path ---
; Order matters: custom overrides third_party, which overrides standard odoo addons
addons_path = /mnt/extra-addons/custom,/mnt/extra-addons/third_party,/usr/lib/python3/dist-packages/odoo/addons

; --- Database Settings ---
; 'db' resolves via Docker Compose's internal network
db_host = db
db_port = 5432
db_user = alomar_user
db_password = alomar_secure_db_pass_2026
db_name = False
db_maxconn = 64

; --- Master Password ---
; Used for database operations: /web/database/manager
admin_passwd = alomar_super_admin_master_pwd

; --- Multi-Tenant & Server Isolation ---
; Restrict visible databases to only those starting with 'alomar'
dbfilter = ^alomar.*$

; Set to False in production after creating the database to prevent public DB listing
list_db = True

; --- Reverse Proxy Mode ---
; CRITICAL: Must be True when running behind Nginx / Traefik / Cloudflare
proxy_mode = True

; --- Worker & Multi-Processing Configuration ---
; Rule of thumb for workers: (2 * number of CPU cores) + 1
; When workers > 0, longpolling/gevent/websocket runs on port 8072
workers = 2
max_cron_threads = 1

; --- Resource Limits ---
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; --- Logging ---
log_level = info
log_handler = [':INFO']
; To log to file instead of stdout (container logs), uncomment below:
; logfile = /var/log/odoo/odoo.log

; --- Production Tweaks ---
without_demo = True
